        <h1>リンゴ</h1>
        <img src="images/apple.png" alt="リンゴの画像">
        <p>
        果物の一種。多数の品種がある。色で分けると、赤色リンゴ（つがる、ふじ、紅玉など）、黄色リンゴ（王林など）がある。
        国内の生産地としては、<span id="hoge">青森県</span>が全国の生産量の半数以上を占める。次に長野県の生産が多い。
        生で食べられるほか、加熱して焼きリンゴとして食べてもおいしい。
        </p>
        <p id="jisho">
        『リンゴ（林檎、学名：Malus domestica, Malus pumila）は、バラ科リンゴ属の落葉高木、またはその果実のこと。』
        （出典: フリー百科事典『ウィキペディア（Wikipedia）』）
        </p>
